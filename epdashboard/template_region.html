<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* SAEDashboard-style: one white sheet, bold uppercase section heads, no boxes. */
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: #111;
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: #1a56b0; text-decoration: none; }
a:hover { text-decoration: underline; }

#toolbar { padding: 10px 14px; display: flex; gap: 6px; align-items: center; }
#toolbar select { font: 12px system-ui; padding: 2px 4px; max-width: 480px;
  background: #eee; border: 1px solid #bbb; border-radius: 3px; }
#toolbar button { font: 12px system-ui; padding: 2px 8px; cursor: pointer;
  background: #eee; border: 1px solid #bbb; border-radius: 3px; }
#toolbar button:disabled { opacity: .4; cursor: default; }
#toolbar .pos { color: #888; font-size: 12px; }

#sheet { margin: 0 14px 8px; border: 1px solid #ccc; background: #fff;
  overflow-x: auto; }
#cols { display: flex; flex-wrap: nowrap; gap: 44px; padding: 28px 34px;
  width: max-content; min-width: 100%; }
.col { flex: 0 0 auto; }
.col.stats { width: 250px; }
.col.plots { width: 340px; }
.col.seqcol { width: 560px; }

h2 { font-size: 15px; font-weight: 800; letter-spacing: .02em; margin: 0 0 2px;
  text-transform: uppercase; }
h2 .sub { display: block; font-size: 13px; font-weight: 800;
  text-transform: none; }
.sect { margin-bottom: 26px; }
.small { color: #888; font-size: 11px; margin: 1px 0 6px; }

table.kv { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.kv td { padding: 1.5px 0; }
table.kv td:first-child { color: #555; padding-right: 12px; }
table.kv td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

table.nbrs { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.nbrs th { text-align: left; color: #888; font-weight: 400;
  font-size: 12px; padding: 0 8px 3px 0; }
table.nbrs th:nth-child(2) { text-align: right; }
table.nbrs td { padding: 1.5px 8px 1.5px 0; vertical-align: top; }
table.nbrs td.cos { text-align: right; font-variant-numeric: tabular-nums; }
table.nbrs td.toks { color: #999; overflow: hidden; white-space: nowrap;
  text-overflow: ellipsis; max-width: 120px; font-size: 12px; }

.lenscols { display: flex; gap: 26px; }
.lenscols > div { flex: 1; min-width: 0; }
h3.lensh { font-size: 13px; font-weight: 800; text-transform: uppercase;
  margin: 0 0 6px; }
.lrow { display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 4px; gap: 8px; }
.tk { padding: 0 5px; border-radius: 3px; white-space: pre;
  font: 12px ui-monospace, "SF Mono", Menlo, monospace; }
.tk.neg { background: #fbc5c5; }
.tk.pos { background: #b9bdf3; }
.lrow .v { color: #333; font-variant-numeric: tabular-nums; font-size: 12px; }

svg.hist { display: block; width: 100%; height: 110px; }
.axislab { font-size: 10px; fill: #888; font-family: inherit; }
.legend { display: flex; gap: 12px; font-size: 11px; color: #777; margin-top: 2px; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 4px;
  vertical-align: -1px; }

.seq { font: 12px/1.75 ui-monospace, "SF Mono", Menlo, monospace;
  margin-bottom: 2px; overflow-wrap: anywhere; }
.t { white-space: pre-wrap; border-radius: 2px; padding: 0.5px 0; }
.t.fire { font-weight: 700; }
.t.mem { box-shadow: inset 0 -1px 0 0 #bbb; }

#footer { color: #999; font-size: 11px; padding: 6px 16px 26px; }
#footer b { color: #666; font-weight: 600; }

#tip { position: fixed; pointer-events: none; z-index: 10; display: none;
  background: #fff; color: #111; border: 1px solid #bbb; padding: 5px 8px;
  font-size: 11px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 320px; }
#tip .k { color: #888; }
</style>
</head>
<body>
<div id="toolbar">
  <select id="regsel"></select>
  <button id="prev">‹</button>
  <button id="next">›</button>
  <span class="pos" id="regpos"></span>
</div>
<div id="sheet"><div id="cols"></div></div>
<div id="footer"></div>
<div id="tip"></div>
<script id="payload" type="application/json">__DATA__</script>
<script>
"use strict";
const P = JSON.parse(document.getElementById("payload").textContent);
const H = P.header, B = P.batch, FILE_OF = P.fileOf;
const IDS = H.regionTable.map(r => r.i);
const byId = {}; B.regions.forEach(r => { byId[r.i] = r; });

const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const showTok = s => s.replace(/\n/g, "\\n").replace(/\t/g, "\\t");
const fmt = (v, d=3) => v == null ? "–" : Number(v).toFixed(d);

// ------------------------------------------------------------------ nav
const sel = document.getElementById("regsel");
for (const r of H.regionTable) {
  const o = document.createElement("option");
  o.value = r.i;
  o.textContent = `${r.i}${r.label ? " · " + r.label : ""} · ` +
    (r.lensTop || []).map(showTok).join(" ");
  sel.appendChild(o);
}
function currentId() {
  const m = location.hash.match(/r(\d+)/);
  const id = m ? +m[1] : (B.regionIds[0]);
  return byId[id] != null ? id : B.regionIds[0];
}
function go(id) {
  if (byId[id] != null) { location.hash = "r" + id; render(); }
  else { location.href = FILE_OF[id].replace(/\.json$/, ".html") + "#r" + id; }
}
sel.addEventListener("change", () => go(+sel.value));
document.getElementById("prev").addEventListener("click", () => {
  const k = IDS.indexOf(currentId()); if (k > 0) go(IDS[k - 1]);
});
document.getElementById("next").addEventListener("click", () => {
  const k = IDS.indexOf(currentId()); if (k < IDS.length - 1) go(IDS[k + 1]);
});
window.addEventListener("hashchange", render);

// -------------------------------------------------------------- tooltip
const tip = document.getElementById("tip");
function tipShow(html, ev) {
  tip.innerHTML = html; tip.style.display = "block";
  const pad = 12, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 4) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 4) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function tipHide() { tip.style.display = "none"; }

// ------------------------------------------------------------ histograms
function histSVG(series, lo, hi, hover) {
  // series drawn back-to-front, each peak-normalised. SAEDashboard-style
  // ticks: 5 x-labels along the baseline.
  const W = 320, Hh = 110, top = 4, bot = 16, n = series[0].counts.length;
  const bw = W / n;
  const ns = document.createElementNS.bind(document, "http://www.w3.org/2000/svg");
  const svg = ns("svg");
  svg.setAttribute("class", "hist");
  svg.setAttribute("viewBox", `0 0 ${W} ${Hh}`);
  const base = ns("line");
  base.setAttribute("x1", 0); base.setAttribute("x2", W);
  base.setAttribute("y1", Hh - bot); base.setAttribute("y2", Hh - bot);
  base.setAttribute("stroke", "#ccc");
  svg.appendChild(base);
  for (const s of series) {
    const peak = Math.max(1, ...s.counts);
    for (let b = 0; b < n; b++) {
      if (!s.counts[b]) continue;
      const hgt = (Hh - top - bot) * s.counts[b] / peak;
      const r = ns("rect");
      r.setAttribute("x", (b * bw + 0.5).toFixed(1));
      r.setAttribute("width", Math.max(0.8, bw - 1).toFixed(1));
      r.setAttribute("y", (Hh - bot - hgt).toFixed(1));
      r.setAttribute("height", hgt.toFixed(1));
      r.setAttribute("fill", s.fill);
      svg.appendChild(r);
    }
  }
  for (let b = 0; b < n; b++) {
    const r = ns("rect");
    r.setAttribute("x", b * bw); r.setAttribute("width", bw);
    r.setAttribute("y", 0); r.setAttribute("height", Hh - bot);
    r.setAttribute("fill", "transparent");
    const a = lo + (hi - lo) * b / n, z = lo + (hi - lo) * (b + 1) / n;
    r.addEventListener("mousemove", ev => tipShow(hover(b, a, z), ev));
    r.addEventListener("mouseleave", tipHide);
    svg.appendChild(r);
  }
  for (let t = 0; t <= 4; t++) {
    const x = W * t / 4;
    const lab = ns("text");
    lab.setAttribute("x", x);
    lab.setAttribute("y", Hh - 3);
    lab.setAttribute("class", "axislab");
    lab.setAttribute("text-anchor", t === 0 ? "start" : t === 4 ? "end" : "middle");
    lab.textContent = fmt(lo + (hi - lo) * t / 4, 2);
    svg.appendChild(lab);
    if (t > 0 && t < 4) {
      const tick = ns("line");
      tick.setAttribute("x1", x); tick.setAttribute("x2", x);
      tick.setAttribute("y1", Hh - bot); tick.setAttribute("y2", Hh - bot + 3);
      tick.setAttribute("stroke", "#ccc");
      svg.appendChild(tick);
    }
  }
  return svg;
}

// --------------------------------------------------------------- tokens
// SAEDashboard idiom: orange highlight ∝ activation; the firing token gets
// the saturated orange. Negative projections (no SAE analogue) go light blue.
function tokenSpan(tokens, acts, mb, fi, scale, dist) {
  const wrap = document.createElement("span");
  const mem = new Set(mb || []);
  tokens.forEach((tk, j) => {
    const s = document.createElement("span");
    s.className = "t" + (j === fi ? " fire" : "") + (mem.has(j) ? " mem" : "");
    s.textContent = tk.replace(/\n/g, "\\n");
    const v = acts[j];
    if (v != null && scale > 0) {
      const a = Math.min(1, Math.abs(v) / scale);
      s.style.background = v >= 0
        ? `rgba(255,140,0,${(a * 0.85).toFixed(3)})`
        : `rgba(90,110,235,${(a * 0.5).toFixed(3)})`;
    }
    s.addEventListener("mousemove", ev => tipShow(
      `<b>${esc(showTok(tk))}</b><br><span class="k">proj</span> ${v == null ? "– (pos 0)" : fmt(v)}` +
      (j === fi ? `<br><span class="k">firing token · d=</span>${fmt(dist, 4)}` : "") +
      `<br><span class="k">member:</span> ${mem.has(j) ? "yes" : "no"}`, ev));
    s.addEventListener("mouseleave", tipHide);
    wrap.appendChild(s);
  });
  return wrap;
}

// --------------------------------------------------------------- render
function sect(parent, titleHTML, note) {
  const d = document.createElement("div");
  d.className = "sect";
  d.innerHTML = `<h2>${titleHTML}</h2>` +
    (note ? `<p class="small">${esc(note)}</p>` : "");
  parent.appendChild(d);
  return d;
}

function lensSect(parent, title, tab) {
  const d = sect(parent, title);
  const cols = document.createElement("div");
  cols.className = "lenscols";
  const mk = (name, toks, cls) => {
    const c = document.createElement("div");
    c.innerHTML = `<h3 class="lensh">${name}</h3>`;
    for (const t of toks) {
      const row = document.createElement("div");
      row.className = "lrow";
      const chip = document.createElement("span");
      chip.className = "tk " + cls;
      chip.textContent = showTok(t);
      row.appendChild(chip);
      c.appendChild(row);
    }
    cols.appendChild(c);
  };
  mk("negative", tab.neg, "neg");
  mk("positive", tab.pos, "pos");
  d.appendChild(cols);
}

function render() {
  const id = currentId();
  const r = byId[id];
  sel.value = id;
  const k = IDS.indexOf(id);
  document.getElementById("prev").disabled = k <= 0;
  document.getElementById("next").disabled = k >= IDS.length - 1;
  document.getElementById("regpos").textContent = `${k + 1} / ${IDS.length}`;
  const cols = document.getElementById("cols");
  cols.innerHTML = "";
  const col = cls => {
    const c = document.createElement("div");
    c.className = "col " + cls;
    cols.appendChild(c);
    return c;
  };

  // ---- stats column
  const c1 = col("stats");
  const st = r.stats;
  const s1 = sect(c1, `region ${r.i}` +
    (r.label ? `<span class="sub">${esc(r.label)}</span>` : ""));
  s1.insertAdjacentHTML("beforeend", `<table class="kv">
    <tr><td>members (build)</td><td>${st.n.toLocaleString()}</td></tr>
    <tr><td>members (scan)</td><td>${st.nScan.toLocaleString()}</td></tr>
    <tr><td>density</td><td>${(st.density * 100).toFixed(3)}%</td></tr>
    <tr><td>coherence</td><td>${fmt(st.coherence)}</td></tr>
    <tr><td>mean dist / θ</td><td>${fmt(st.meanDist, 3)} / ${fmt(H.dict.threshold, 3)}</td></tr>
    <tr><td>proj mean ± sd</td><td>${fmt(st.projMean)} ± ${fmt(st.projSd)}</td></tr>
    <tr><td>proj max</td><td>${fmt(st.projMax)}</td></tr>` +
    // Cell shell — absent from records built before these accumulators existed.
    (st.margin == null ? "" : `
    <tr><td>mean margin</td><td>${fmt(st.margin, 3)}</td></tr>
    <tr><td>contested</td><td>${(st.contested * 100).toFixed(1)}%</td></tr>`) + `
  </table>`);
  // Exemplar context: the first-arrival activation that seeded the region.
  if (r.ex) {
    const sx = sect(c1, "exemplar",
      (r.ex.d > 0.001 ? ` (closest stored member, d=${fmt(r.ex.d, 3)})` : ""));
    const seq = document.createElement("div");
    seq.className = "seq";
    const t = r.ex.t;
    if (r.ex.a >= 0) {
      seq.append(t.slice(0, r.ex.a).replace(/\n/g, "\\n"));
      const hi = document.createElement("span");
      hi.className = "t fire";
      hi.style.background = "rgba(255,140,0,0.85)";
      hi.textContent = t.slice(r.ex.a, r.ex.b).replace(/\n/g, "\\n");
      hi.title = `exemplar token · pos ${r.ex.pos}`;
      seq.appendChild(hi);
      seq.append(t.slice(r.ex.b).replace(/\n/g, "\\n"));
    } else {
      seq.append(t.replace(/\n/g, "\\n"));
    }
    sx.appendChild(seq);
  }

  const s2 = sect(c1, "nearest regions", "full-space cosine between exemplars");
  const tb = document.createElement("table");
  tb.className = "nbrs";
  tb.innerHTML = `<tr><th>region</th><th>cos</th><th></th></tr>`;
  for (const [j, cs] of r.neighbors) {
    const row = H.regionTable.find(x => x.i === j) || {};
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><a href="#" data-j="${j}">${j}</a></td>` +
      `<td class="cos">${fmt(cs)}</td>` +
      `<td class="toks">${esc((row.lensTop || []).map(showTok).join(" "))}</td>`;
    tr.querySelector("a").addEventListener("click", ev => { ev.preventDefault(); go(j); });
    tb.appendChild(tr);
  }
  s2.appendChild(tb);

  // Competition graph: who actually comes second for this region's members.
  // Distinct from the cosine table above — a region's rival for tokens need
  // not be its nearest exemplar.
  if (r.competitors && r.competitors.length) {
    const s2b = sect(c1, "competitors", "runner-up cell for this region's members");
    const tc = document.createElement("table");
    tc.className = "nbrs";
    tc.innerHTML = `<tr><th>region</th><th>share</th><th></th></tr>`;
    for (const [j, , share] of r.competitors) {
      const row = H.regionTable.find(x => x.i === j) || {};
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><a href="#" data-j="${j}">${j}</a></td>` +
        `<td class="cos">${(share * 100).toFixed(1)}%</td>` +
        `<td class="toks">${esc((row.lensTop || []).map(showTok).join(" "))}</td>`;
      tr.querySelector("a").addEventListener("click", ev => { ev.preventDefault(); go(j); });
      tc.appendChild(tr);
    }
    s2b.appendChild(tc);
  }

  // ---- plots column
  const c2 = col("plots");
  const ph = r.projHist;
  const s3 = sect(c2, `projections<span class="sub">density = ${(st.density * 100).toFixed(3)}%</span>`);
  s3.appendChild(histSVG(
    [{counts: ph.bg, fill: "rgba(150,150,150,0.45)"},
     {counts: ph.member, fill: "rgba(253,166,65,0.95)"}],
    ph.range[0], ph.range[1],
    (b, a, z) => `<span class="k">proj ∈</span> [${fmt(a,2)}, ${fmt(z,2)})<br>` +
      `<span class="k">members:</span> ${ph.member[b]} &nbsp; <span class="k">corpus:</span> ${ph.bg[b]}`));
  const lg = document.createElement("div");
  lg.className = "legend";
  lg.innerHTML = `<span><i style="background:rgba(253,166,65,.95)"></i>members (n=${ph.nMember})</span>` +
    `<span><i style="background:rgba(150,150,150,.45)"></i>corpus sample</span>`;
  s3.appendChild(lg);

  const dh = r.distHist;
  const s4 = sect(c2, "distance to exemplar",
    "all scanned members, bins over [0, θ]");
  s4.appendChild(histSVG(
    [{counts: dh.counts, fill: "rgba(253,166,65,0.95)"}], 0, dh.max,
    (b, a, z) => `<span class="k">d ∈</span> [${fmt(a,3)}, ${fmt(z,3)})<br>` +
      `<span class="k">members:</span> ${dh.counts[b]}`));

  const L = r.lens;
  lensSect(c2, "logit lens · exemplar", L.exemplar);
  lensSect(c2, "logit lens · mean dir", L.mean);
  if (L.jlens) {
    lensSect(c2, `j-lens · exemplar`, L.jlens);
    lensSect(c2, "j-lens · mean dir", L.jlensMean);
  }

  // ---- sequence columns (one per group, SAEDashboard quantile-style)
  let scale = st.projMax || 0;
  for (const g of r.groups)
    for (const s of g.seqs)
      for (const v of s.act) if (v != null) scale = Math.max(scale, Math.abs(v));
  for (const g of r.groups) {
    const c = col("seqcol");
    const head = g.key === "closest"
      ? `closest members<span class="sub">max proj = ${fmt(st.projMax)}</span>`
      : esc(g.title) + (g.subtitle ? `<span class="sub">${esc(g.subtitle)}</span>` : "");
    const s = sect(c, head);
    if (!g.seqs.length)
      s.insertAdjacentHTML("beforeend", `<p class="small">no examples</p>`);
    for (const q of g.seqs) {
      const row = document.createElement("div");
      row.className = "seq";
      row.appendChild(tokenSpan(q.tok, q.act, q.mb, q.fi, scale, q.d));
      s.appendChild(row);
    }
  }

  // ---- footer provenance (replaces the old top bar)
  const d = H.dict;
  document.getElementById("footer").innerHTML =
    `<b>${esc(d.model_id)}</b> · layer ${d.layer}` +
    (d.p != null ? ` · p=${d.p}` : "") +
    ` · K=${d.K} · θ=${d.threshold} · d_model=${d.dModel}` +
    ` &nbsp;|&nbsp; scanned ${H.scan.nActs.toLocaleString()} activations` +
    ` (${esc(H.source.dataset || H.source.cache_dir || "?")}, ${esc(H.source.mode)})` +
    ` · member-share corr ${H.scan.member_share_corr}` +
    (H.lens.jlens ? ` · j-lens n=${H.lens.jNPrompts}` : "") +
    ` &nbsp;|&nbsp; <a href="index.html">dictionary view</a>` +
    ` · EPDashboard · ${esc(d.run)}`;
}
render();
</script>
</body>
</html>
